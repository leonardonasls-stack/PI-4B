name: CI Pipeline - Vacina Alagoas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vacinacao_al
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Seed
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d vacinacao_al -f sql/init.sql
          psql -h localhost -U postgres -d vacinacao_al -f sql/seed.sql

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vacinacao_al
          SYNC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vacinacao_al
          SECRET_KEY: test_secret_key_ci_environment_2026
          PYTHONPATH: backend
        run: |
          pytest backend/tests/ -v

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Build
        run: |
          docker compose build
