server {
    listen 80;
    server_name localhost;
    port_in_redirect off;
    absolute_redirect off;

    # Documentação Swagger e ReDoc + OpenAPI Spec da API FastAPI
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Endpoints da FastAPI
    location ~ ^/(cities|vaccination-points|auth|api|admin/(enrichment|vaccination-points)) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Atalho direto para o painel administrativo sem redirect externo
    location = /admin {
        rewrite ^ /admin.html last;
    }

    # Arquivos estáticos do frontend SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
