<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Vacina Alagoas{% endblock %} — Sistema de Imunização</title>
  <!-- Tailwind CSS via CDN oficial -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-300 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- NAVBAR DA APLICAÇÃO (PADRÃO 2 OFICIAL: AZUL PETRÓLEO ESCURO) -->
  <header class="bg-slate-900 border-b border-cyan-950 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 py-3.5 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center bg-cyan-700 text-white shadow group-hover:bg-cyan-600 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <div>
          <span class="font-extrabold text-base leading-tight block text-white tracking-wide">Vacina Alagoas</span>
          <span class="text-[11px] text-cyan-200">Secretaria de Estado da Saúde · Governo de Alagoas</span>
        </div>
      </a>

      <div class="flex items-center gap-3">
        <a href="/docs" target="_blank" class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition">
          Swagger /docs
        </a>
        <a href="/admin" class="text-xs font-bold px-3 py-1.5 rounded-lg border border-cyan-700 bg-cyan-800 text-white hover:bg-cyan-700 transition shadow-sm">
          Área Restrita (Admin)
        </a>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL INJETADO -->
  <main class="flex-grow">
    {% block content %}{% endblock %}
  </main>

  <!-- RODAPÉ SÓLIDO (WCAG 2.1 AA) -->
  <footer class="bg-slate-950 text-slate-400 border-t border-slate-800 text-xs py-5 px-4 text-center">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
      <span>Projeto Integrador IV-B · Consulta Pública de Postos de Imunização em Alagoas</span>
      <span class="text-slate-500">Desenvolvido com FastAPI, PostgreSQL 16 & OpenStreetMap (OSM)</span>
    </div>
  </footer>

</body>
</html>
